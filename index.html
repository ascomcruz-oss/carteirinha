<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carteirinha</title>

<style>
body {
  margin: 0;
  background: #ccc;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CONTAINER */
.carteira {
  width: 900px;
  position: relative;
}

/* IMAGEM DE FUNDO REAL (SEM DISTORÇÃO) */
.bg {
  width: 100%;
  height: auto;
  display: block;
}

/* ELEMENTOS POR CIMA */
.foto,
.input,
.upload {
  position: absolute;
}

/* FOTO */
.foto {
  top: 17%;
  left: 7.6%;
  width: 25%;
  height: 60%;
  overflow: hidden;
  border-radius: 8px;
}

.foto img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* INPUTS */
.input {
  width: 43%;
  padding: 0.6%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 0.95rem;
  color: #000;
}

/* POSIÇÕES */
.nome { top: 31.5%; left: 40.7%; }
.cpf  { top: 46.5%; left: 40.7%; }
.inst { top: 63.5%; left: 40.7%; }

/* UPLOAD */
.upload {
  bottom: 5%;
  left: 5%;
}

/* BOTÃO */
.btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 15px;
  background: black;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* PRINT */
@media print {
  body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .btn, .upload {
    display: none;
  }
}
</style>
</head>

<body>

<div class="carteira">

  <!-- IMAGEM REAL -->
  <img src="fundo.png" class="bg">

  <!-- FOTO -->
  <div class="foto">
    <img id="preview">
  </div>

  <!-- INPUTS -->
  <input class="input nome" placeholder="NOME">
  <input class="input cpf" placeholder="CPF">
  <input class="input inst" placeholder="INSTITUIÇÃO DE ENSINO">

  <!-- UPLOAD -->
  <input class="upload" type="file" accept="image/*" onchange="carregarFoto(event)">

</div>

<button class="btn" onclick="window.print()">Baixar PDF</button>

<script>
function carregarFoto(event) {
  const img = document.getElementById('preview');
  const file = event.target.files[0];

  if (file) {
    img.src = URL.createObjectURL(file);
  }
}
</script>

</body>
</html>
